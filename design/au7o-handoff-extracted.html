  <style>/* Au7o tokens — automotive without aggressive */
:root {
  /* Brand */
  --au7o-blue: #3B82F6;
  --au7o-blue-600: #2563EB;
  --au7o-blue-700: #1D4ED8;
  --au7o-blue-50: #EFF6FF;
  --au7o-blue-100: #DBEAFE;

  /* Neutrals — warm, not sterile */
  --paper: #F7F6F2;        /* at-home surfaces / map base */
  --paper-2: #EFEDE6;      /* recessed */
  --paper-line: #E3DFD4;   /* hairline on paper */
  --ink: #0B1220;          /* high-contrast text + in-car nav bg */
  --ink-2: #19223A;        /* in-car raised */
  --ink-3: #2A3450;        /* in-car border */
  --slate-700: #334155;
  --slate-500: #64748B;
  --slate-400: #94A3B8;
  --slate-300: #CBD5E1;
  --slate-200: #E2E8F0;
  --slate-100: #F1F5F9;

  /* Semantic — safety only */
  --ok: #10B981;
  --ok-bg: #D1FAE5;
  --warn: #F59E0B;
  --warn-bg: #FEF3C7;
  --crit: #EF4444;
  --crit-bg: #FEE2E2;

  /* Map (warm paper) */
  --map-bg: #F2EEE3;
  --map-road: #FFFFFF;
  --map-road-edge: #E2DBC7;
  --map-block: #E8E2D2;
  --map-water: #C9DCE6;
  --map-park: #D5E2C9;
  --route: var(--au7o-blue);

  /* Type */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Radii */
  --r-1: 6px;
  --r-2: 10px;
  --r-3: 14px;
  --r-4: 20px;
  --r-5: 28px;
  --r-pill: 999px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(11,18,32,.06), 0 1px 1px rgba(11,18,32,.04);
  --shadow-2: 0 6px 16px rgba(11,18,32,.08), 0 2px 4px rgba(11,18,32,.05);
  --shadow-3: 0 18px 40px rgba(11,18,32,.18), 0 6px 12px rgba(11,18,32,.08);
  --shadow-sheet: 0 -10px 30px rgba(11,18,32,.12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
  background: #ECE9DF;
}

/* canvas wrapper background — subtle paper texture */
.au7o-canvas-bg {
  background:
    radial-gradient(circle at 20% 10%, rgba(59,130,246,0.04), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(11,18,32,0.03), transparent 50%),
    #ECE9DF;
}

/* Phone frame */
.phone {
  width: 390px;
  height: 844px;
  background: var(--paper);
  border-radius: 44px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 0 12px #1A1F2C,
    0 0 0 13px #0B1220,
    var(--shadow-3);
  isolation: isolate;
}
.phone-screen {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 32px;
  display: flex;
  flex-direction: column;
}
.notch {
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 32px;
  background: #0B1220;
  border-radius: 999px;
  z-index: 50;
}
.statusbar {
  height: 50px;
  padding: 16px 28px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  position: relative;
  z-index: 5;
  flex: 0 0 auto;
}
.statusbar.dark { color: #fff; }
.statusbar .right { display: flex; gap: 6px; align-items: center; }
.statusbar .battery {
  width: 24px; height: 11px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  position: relative;
  opacity: 0.9;
}
.statusbar .battery::after {
  content: ""; position: absolute;
  right: -3px; top: 2px;
  width: 1.5px; height: 5px;
  background: currentColor; border-radius: 0 1px 1px 0;
}
.statusbar .battery::before {
  content: ""; position: absolute;
  inset: 1px; right: auto;
  width: 16px; background: currentColor; border-radius: 1px;
}

/* Generic scroll lock for screens */
.screen-body { flex: 1 1 auto; overflow: hidden; position: relative; }

/* Pill */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 500;
  background: rgba(11,18,32,0.06);
  color: var(--ink);
}
.pill.dark { background: rgba(255,255,255,0.12); color: #fff; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 14px 18px;
  border-radius: var(--r-3);
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  letter-spacing: -0.01em;
  transition: transform .12s ease, background .15s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: var(--ink-2); }
.btn-blue { background: var(--au7o-blue); color: #fff; }
.btn-blue:hover { background: var(--au7o-blue-600); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-soft { background: rgba(11,18,32,0.06); color: var(--ink); }

/* Cards */
.card {
  background: #fff;
  border: 1px solid var(--paper-line);
  border-radius: var(--r-3);
  padding: 16px;
}
.card-flat {
  background: var(--paper-2);
  border-radius: var(--r-3);
  padding: 14px;
}

/* Status row dots */
.status-dot {
  width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto;
}
.status-dot.ok { background: var(--ok); }
.status-dot.warn { background: var(--warn); }
.status-dot.crit { background: var(--crit); }

/* Hairline */
.hr { height: 1px; background: var(--paper-line); border: 0; margin: 0; }

/* Mono numerals */
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; letter-spacing: -0.01em; }

/* Heading reset */
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
p { margin: 0; }

/* keep DCArtboard visuals tidy */
.dc-artboard-frame { background: transparent; }

/* small caps label */
.label-eyebrow {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--slate-500);
}

/* lock chip */
.lock-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  background: var(--ink); color: #fff;
}

/* For section header artboards */
.section-card {
  width: 100%;
  padding: 24px;
  background: #fff;
  border: 1px solid var(--paper-line);
  border-radius: 18px;
}

/* Animations for handoff hero */
@keyframes au7o-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
  50% { box-shadow: 0 0 0 12px rgba(245,158,11,0); }
}
.pulse-warn { animation: au7o-pulse 2s ease-out infinite; }

@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); }
  50% { box-shadow: 0 0 0 18px rgba(59,130,246,0); }
}

@keyframes wave {
  0% { transform: scaleY(0.4); }
  50% { transform: scaleY(1); }
  100% { transform: scaleY(0.4); }
}
</style>
  <style>/* Au7o web — additional tokens layered on top of src/tokens.css */

/* Ambient background animations */
@keyframes au7o-float-a {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(40px, 30px) scale(1.05); }
}
@keyframes au7o-float-b {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-30px, -40px) scale(1.08); }
}
@keyframes au7o-float-c {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(20px, -50px) scale(0.95); }
}

/* Slow drift for hero hint pulses */
@keyframes au7o-pulse-soft {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}
.au7o-pulse-soft { animation: au7o-pulse-soft 4s ease-in-out infinite; }

/* Type scrolling for chat reply */
@keyframes au7o-blink { 50% { opacity: 0; } }
.au7o-cursor::after {
  content: "▎"; margin-left: 2px;
  animation: au7o-blink 1s steps(2) infinite;
  color: var(--au7o-blue);
}

/* Web frame (browser-window-style preview area) */
.web-frame {
  background: var(--paper);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--paper-line);
  box-shadow: var(--shadow-2);
  position: relative;
  isolation: isolate;
}
.web-frame-chrome {
  height: 38px;
  background: linear-gradient(180deg,#fff,#F4F2EC);
  border-bottom: 1px solid var(--paper-line);
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--slate-500);
}
.web-frame-chrome .lights { display:flex; gap: 6px; }
.web-frame-chrome .lights span { width: 10px; height: 10px; border-radius: 50%; background: #d6d2c5; }
.web-frame-chrome .url {
  background: #fff; border: 1px solid var(--paper-line);
  padding: 4px 10px; border-radius: 999px;
  margin-left: auto; margin-right: auto;
  display: flex; align-items: center; gap: 6px;
}
.web-frame-body { background: var(--paper); position: relative; }

/* Card lift on hover */
.web-card-lift { transition: transform .25s ease, box-shadow .25s ease; cursor: pointer; }
.web-card-lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }

/* Soft outline buttons */
.btn-outline {
  background: #fff; color: var(--ink); border: 1px solid var(--paper-line);
  padding: 12px 16px; border-radius: 12px; font-weight: 500; font-family: var(--font-sans);
  font-size: 14px; cursor: pointer; display:inline-flex; align-items:center; gap: 8px;
  transition: background .15s ease, transform .12s ease;
}
.btn-outline:hover { background: var(--paper-2); }
.btn-outline:active { transform: scale(0.98); }

/* Chip */
.chip {
  display:inline-flex; align-items:center; gap: 6px;
  padding: 6px 12px;
  background: #fff; border: 1px solid var(--paper-line);
  border-radius: 999px;
  font-size: 13px; color: var(--slate-700); font-weight: 500;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.chip:hover { background: var(--paper-2); border-color: var(--slate-300); }
.chip-sm { padding: 4px 9px; font-size: 11.5px; }

/* Eyebrow */
.eyebrow {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--slate-500);
}

/* Scrollable inner panes for web mockups */
.web-scroll {
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--paper-line) transparent;
}
.web-scroll::-webkit-scrollbar { width: 6px; }
.web-scroll::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 3px; }

/* Thinner h-rule */
.hrule { height: 1px; background: var(--paper-line); border: 0; }

/* Map dot pulse */
@keyframes au7o-mappulse {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(2.6); opacity: 0; }
}
.map-pulse {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--au7o-blue);
  animation: au7o-mappulse 1.8s ease-out infinite;
}

/* Conversation bubbles */
.bubble-user {
  background: var(--ink); color: #fff;
  border-radius: 18px 18px 4px 18px;
  padding: 12px 16px; font-size: 14.5px; line-height: 1.45;
  max-width: 80%; align-self: flex-end;
}
.bubble-au7o {
  background: #fff; color: var(--ink);
  border: 1px solid var(--paper-line);
  border-radius: 18px 18px 18px 4px;
  padding: 14px 16px; font-size: 14.5px; line-height: 1.5;
  max-width: 92%;
  box-shadow: var(--shadow-1);
}

/* Subtle dotted grid for direction backdrops */
.dotted-grid {
  background-image: radial-gradient(circle at 1px 1px, rgba(11,18,32,0.06) 1px, transparent 0);
  background-size: 18px 18px;
}

  );
