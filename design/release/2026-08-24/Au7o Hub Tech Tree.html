  <style>
a{color:var(--au7o-blue)}a:hover{color:var(--au7o-blue-600)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ki-desk);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono)}
@keyframes hlBubble{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hl-bubble{animation:hlBubble .35s ease}
@keyframes thPulse{0%,100%{box-shadow:0 0 12px currentColor}50%{box-shadow:0 0 26px currentColor}}
.th-dot{animation:thPulse 2.4s ease-in-out infinite;color:rgba(76,201,240,.7)}
.th-dot-risk{color:rgba(255,107,99,.8);animation-duration:1.5s}
@keyframes ttGlowCrit{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.42),var(--shadow-1)}50%{box-shadow:0 0 0 6px rgba(229,72,77,0),0 0 18px rgba(229,72,77,.55)}}
.tt-glow-crit{animation:ttGlowCrit 2s ease-in-out infinite}
.tt-glow-watch{box-shadow:0 0 12px rgba(217,130,43,.35),var(--shadow-1)}
.tt-node{user-select:none}
.tt-node:active{cursor:grabbing}
@keyframes thFade{from{opacity:0}to{opacity:1}}
@keyframes thRise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.th-overlay{animation:thFade .2s ease}
.th-sheet{animation:thRise .3s cubic-bezier(.2,.7,.3,1)}
  </style>
