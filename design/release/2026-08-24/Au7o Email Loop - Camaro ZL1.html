<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Au7o — email hero loop · 2019 Chevrolet Camaro ZL1 1LE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#EDEAE2;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#capture{width:1040px;aspect-ratio:1536/1024;flex:none;background:#0A0D14;position:relative;overflow:hidden}
.stage{position:absolute;inset:0}
.stage img{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain}
.glow{opacity:0;transition:opacity .55s ease}
.glow.on{opacity:1}
.mk{position:absolute;transform:translate(-26px,-26px);display:flex;align-items:center;gap:0;width:max-content;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2.5px solid;backdrop-filter:blur(6px);transition:box-shadow .4s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.dot svg{width:26px;height:26px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot.check svg{stroke-width:2.6}
.mk.up .dot{border-color:#A78BFA;background:rgba(139,92,246,.22);color:#EDE4FF}
.mk.od .dot{border-color:#FF6B63;background:rgba(255,107,99,.2);color:#FFD9D6}
.mk.ok .dot{border-color:#35D69B;background:rgba(53,214,155,.2);color:#D8FFF0}
.mk.live .dot{transform:scale(1.12)}
.mk.up.live .dot{box-shadow:0 0 0 8px rgba(139,92,246,.16),0 0 34px rgba(139,92,246,.7)}
.mk.od.live .dot{box-shadow:0 0 0 8px rgba(255,107,99,.16),0 0 34px rgba(255,107,99,.7)}
.mk.ok.live .dot{box-shadow:0 0 0 8px rgba(53,214,155,.16),0 0 34px rgba(53,214,155,.6)}
.lbl{margin-left:10px;white-space:nowrap;font-size:17px;font-weight:600;letter-spacing:-.2px;padding:7px 13px;border-radius:999px;background:rgba(10,13,20,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.13);opacity:0;transform:translateX(-8px);transition:opacity .3s ease,transform .3s ease}
.mk.live .lbl{opacity:1;transform:none}
.mk.up .lbl{color:#EDE4FF}.mk.od .lbl{color:#FFD9D6}.mk.ok .lbl{color:#D8FFF0}
#tree{position:absolute;right:34px;top:50%;transform:translate(14px,-50%);width:352px;background:rgba(16,20,29,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:18px;opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
#tree.on{opacity:1;transform:translate(0,-50%)}
.th{font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#7D8698}
.tt{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.4px;margin-top:5px}
.rows{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);opacity:0;transform:translateY(7px);transition:opacity .35s ease,transform .35s ease}
#tree.on .row{opacity:1;transform:none}
#tree.on .row:nth-child(1){transition-delay:.1s}#tree.on .row:nth-child(2){transition-delay:.2s}#tree.on .row:nth-child(3){transition-delay:.3s}#tree.on .row:nth-child(4){transition-delay:.4s}
.rd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid;flex:none}
.rd svg{width:15px;height:15px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rd.check svg{stroke-width:2.6}
.rd.od{border-color:#FF6B63;background:rgba(255,107,99,.18);color:#FFD9D6}
.rd.ok{border-color:#35D69B;background:rgba(53,214,155,.18);color:#D8FFF0}
.rd.up{border-color:#A78BFA;background:rgba(139,92,246,.2);color:#EDE4FF}
.rl{font-size:15px;font-weight:600;color:#EAEEF5;letter-spacing:-.1px}
.rs{font-size:12.5px;color:#7D8698;margin-top:2px}
#cur{position:absolute;width:26px;height:34px;pointer-events:none;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6));transition:left 1.05s cubic-bezier(.4,.1,.2,1),top 1.05s cubic-bezier(.4,.1,.2,1);z-index:9}
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="22" fill="#0A0D14"/><circle cx="100" cy="92" r="34" fill="none" stroke="#A78BFA" stroke-width="7"/><path d="M100 76l16 7v12c0 11-16 17-16 17s-16-6-16-17V83l16-7Z" fill="#A78BFA"/><text x="100" y="168" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#fff">Au7o</text></svg></template>
<div id="capture">
<div class="stage">
<img src="assets/camaro/base-summit.webp" alt=""/>
<img class="glow" id="g-wheel" src="assets/camaro/glow-wheel-summit.webp" alt=""/>
<img class="glow" id="g-hood" src="assets/camaro/glow-hood-summit.webp" alt=""/>
</div>
<div id="marks"></div>
<div id="tree">
  <div class="th">Wheel, Tire &amp; Brakes</div>
  <div class="tt">4 of 11 need you</div>
  <div class="rows">
    <div class="row"><div class="rd od"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg></div><div><div class="rl">Front Tire</div><div class="rs">Past its life at 38,000 mi</div></div></div>
    <div class="row"><div class="rd up"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10ZM12 8v4M12 16h.01"/></svg></div><div><div class="rl">Front Rotor</div><div class="rs">Known issue &middot; fix available</div></div></div>
    <div class="row"><div class="rd ok check"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="rl">Brake Pads</div><div class="rs">On track</div></div></div>
    <div class="row"><div class="rd ok check"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="rl">Wheel Bearing</div><div class="rs">On track</div></div></div>
  </div>
</div>
<svg id="cur" viewBox="0 0 26 34"><path d="M3 2l17 13-7.5 1.5L17 27l-4 1.7-4.3-10L3 22V2Z" fill="#fff" stroke="#0A0D14" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
const ICON={alert:'<path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>',check:'<path d="M20 6 9 17l-5-5"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10ZM12 8v4M12 16h.01"/>'};
const HOT=[
 {id:"wheel",cls:"od",ic:"alert",x:45,y:61.5,label:"Wheel, Tire & Brakes",glow:"g-wheel",tree:true},
 {id:"hood",cls:"up",ic:"shield",x:61,y:42,label:"Engine",glow:"g-hood"},
 {id:"glass",cls:"ok",ic:"check",x:52,y:36,label:"Windshield Wipers"}
];
const marks=document.getElementById("marks");
marks.innerHTML=HOT.map(h=>`<div class="mk ${h.cls}" id="mk-${h.id}" style="left:${h.x}%;top:${h.y}%"><div class="dot ${h.ic==='check'?'check':''}"><svg viewBox="0 0 24 24" stroke="currentColor">${ICON[h.ic]}</svg></div><div class="lbl">${h.label}</div></div>`).join("");
const cur=document.getElementById("cur"),tree=document.getElementById("tree"),cap=document.getElementById("capture");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function moveTo(h){const r=cap.getBoundingClientRect();cur.style.left=(h.x/100*r.width-4)+"px";cur.style.top=(h.y/100*r.height-2)+"px";}
function clear(){HOT.forEach(h=>{document.getElementById("mk-"+h.id).classList.remove("live");if(h.glow)document.getElementById(h.glow).classList.remove("on");});tree.classList.remove("on");}
async function loop(){
 while(true){
  clear();cur.style.left="88%";cur.style.top="18%";await wait(900);
  for(const h of [HOT[2],HOT[1],HOT[0]]){
   moveTo(h);await wait(1100);
   clear();
   document.getElementById("mk-"+h.id).classList.add("live");
   if(h.glow)document.getElementById(h.glow).classList.add("on");
   await wait(h.tree?700:1300);
   if(h.tree){tree.classList.add("on");await wait(3200);}
  }
  await wait(600);
 }
}
window.addEventListener("load",()=>loop());
</script>
</body>
</html>
