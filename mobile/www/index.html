<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Au7o</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #F7F6F2; color: #0B1220; font-family: system-ui, sans-serif; text-align: center; }
    .wrap { padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #475569; margin: 0 0 16px; }
    button { padding: 12px 20px; border: 0; border-radius: 12px; background: #3B82F6; color: #fff;
             font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Shown only if the live site can't be reached (offline). Capacitor
       loads server.url normally; this file is the local fallback. -->
  <div class="wrap">
    <h1>You're offline</h1>
    <p>Au7o needs an internet connection to diagnose your car.</p>
    <button onclick="window.location.href='https://au7o.io'">Try again</button>
  </div>
</body>
</html>
